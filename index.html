<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database Project</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, textarea, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h2>Add New Record</h2>
    <form id="dataForm">
        <label for="title">Record Title</label>
        <input type="text" id="title" name="title" placeholder="Record Title" required>
        <label for="content">Record Content</label>
        <input type="text" id="content" name="content" placeholder="Record Content" required>
        <button type="submit">Submit to Database</button>
    </form>

    <h2>Database Records</h2>
    <div id="recordsContainer" aria-live="polite">Loading...</div>

    <script>
        // Vercel deployment that serves this page
        const VERCEL_API_URL = 'https://student-api-backend-ten.vercel.app/api';

        // Function to fetch and display records
        async function loadRecords() {
            const container = document.getElementById('recordsContainer');
            try {
                const response = await fetch(VERCEL_API_URL);

                // A protected deployment answers with a redirect to the Vercel login
                // page instead of JSON, so report the status before parsing.
                if (!response.ok) {
                    container.innerText = `Error loading records: API returned ${response.status} ${response.statusText}.`;
                    return;
                }

                const contentType = response.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    container.innerText = 'Error loading records: API did not return JSON (it may be redirecting to a login page).';
                    return;
                }

                const records = await response.json();

                if (!Array.isArray(records)) {
                    container.innerText = 'Error loading records: the API returned an unexpected response.';
                    return;
                }

                container.innerHTML = '';

                if(records.length === 0) {
                    const empty = document.createElement('p');
                    empty.textContent = 'No records found.';
                    container.appendChild(empty);
                    return;
                }

                records.forEach(record => {
                    const div = document.createElement('div');
                    div.className = 'card';

                    // Build the card with textContent so record content is never
                    // parsed as HTML (records are user submitted).
                    const title = document.createElement('strong');
                    title.textContent = record.title ?? '';

                    const lineBreak = document.createElement('br');

                    const content = document.createElement('span');
                    content.textContent = record.content ?? '';

                    div.append(title, lineBreak, content);
                    container.appendChild(div);
                });
            } catch (error) {
                container.innerText = `Error loading records: ${error.message}`;
            }
        }

        // Function to handle form submission
        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                if (!response.ok) {
                    alert(`Failed to submit record: API returned ${response.status} ${response.statusText}.`);
                    return;
                }

                // Clear form and reload records
                document.getElementById('dataForm').reset();
                loadRecords();
            } catch (error) {
                alert(`Failed to submit record: ${error.message}`);
            }
        });

        // Initial load
        loadRecords();
    </script>
</body>
</html>
